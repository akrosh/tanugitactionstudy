name: matrix_with_exclude

on:
  workflow_dispatch: 
jobs:
  muti-version:
    runs-on: ${{matrix.os}}
    strategy:
      matrix:
        os: [ubuntu-latest,windows-latest]
        java: [8,11,17]
        exclude:
          - os: ubuntu-latest
            java: 17
    steps:
      - name: trigger_workflow_java_mutiversion
        run: |
              echo "Testing on ${{matrix.os}} with jaa version ${{matrix.java}} " 
             
